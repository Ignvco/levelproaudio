# cloudbuild.yaml — raíz del repo

substitutions:
  _REGION:           "us-central1"
  _BACKEND_SERVICE:  "levelproaudio-backend"
  _FRONTEND_SERVICE: "levelproaudio-frontend"
  _SQL_INSTANCE:     "levelproaudio:us-central1:levelproaudio-db"
  _SA_EMAIL:         "levelproaudio-run@levelproaudio.iam.gserviceaccount.com"
  _TAG:              "latest"
  _REPO:             "us-central1-docker.pkg.dev/levelproaudio/levelproaudio-docker"

steps:

  # ── 0. Tests backend (bloquea el deploy si algo falla) ─────────
  # Corre el subset de tests que son unitarios reales de Django (DB en
  # memoria, sin dependencias externas). Los tests de integración HTTP
  # (test_loyalty.py, test_rewards.py, etc.) requieren un backend real
  # corriendo + datos sembrados, y quedan fuera de este paso rápido de CI;
  # se siguen corriendo manualmente contra staging/producción como hasta
  # ahora.
  - name: "python:3.12-slim"
    id: "backend-tests"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd backend
        pip install --quiet --no-cache-dir -r requirements/base.txt -r requirements/development.txt
        DJANGO_SECRET_KEY=ci-dummy-key DB_NAME=x DB_USER=x DB_PASSWORD=x \
          DJANGO_SETTINGS_MODULE=config.settings.test \
          python -m pytest tests/ apps/loyalty/ apps/billing/ apps/products/ -v

  # ── 1. Build Backend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    waitFor: ["backend-tests"]
    args:
      - build
      - -t
      - "${_REPO}/backend:${_TAG}"
      - -f
      - backend/Dockerfile.prod
      - ./backend

  # ── 2. Build Frontend ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - build
      - -t
      - "${_REPO}/frontend:${_TAG}"
      - -f
      - frontend/Dockerfile.prod
      - ./frontend

  # ── 3. Push Backend ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args: ["push", "${_REPO}/backend:${_TAG}"]

  # ── 4. Push Frontend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args: ["push", "${_REPO}/frontend:${_TAG}"]

  # ── 5. Deploy Backend ────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["push-backend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_BACKEND_SERVICE}"
      - --image=${_REPO}/backend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=5
      - --service-account=${_SA_EMAIL}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=DJANGO_SETTINGS_MODULE=config.settings.production
      - --set-env-vars=CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}
      # ── Config de pagos (no secreta) ──
      - --set-env-vars=FRONTEND_URL=https://levelproaudio.com
      - --set-env-vars=SITE_URL=https://levelproaudio.com
      - --set-env-vars=BACKEND_URL=https://levelproaudio.com
      - --set-env-vars=PAYPAL_MODE=live
      - --set-env-vars=USD_CLP_RATE=950
      - --update-secrets=DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest
      - --update-secrets=SECRET_KEY=DJANGO_SECRET_KEY:latest
      - --update-secrets=DB_NAME=DB_NAME:latest
      - --update-secrets=DB_USER=DB_USER:latest
      - --update-secrets=DB_PASSWORD=DB_PASSWORD:latest
      - --update-secrets=GCS_BUCKET_NAME=levelproaudio-gcs-bucket:latest
      - --update-secrets=GCS_PROJECT_ID=levelproaudio-gcs-project:latest
      - --update-secrets=DJANGO_ALLOWED_HOSTS=DJANGO_ALLOWED_HOSTS:latest
      # ── Credenciales de pago (Secret Manager) ──
      - --update-secrets=MP_CL_ACCESS_TOKEN=MP_CL_ACCESS_TOKEN:latest
      - --update-secrets=MP_CL_PUBLIC_KEY=MP_CL_PUBLIC_KEY:latest
      - --update-secrets=PAYPAL_CLIENT_ID=PAYPAL_CLIENT_ID:latest
      - --update-secrets=PAYPAL_CLIENT_SECRET=PAYPAL_CLIENT_SECRET:latest
      # NOTA: para activar la validación de firma de los webhooks de MP
      # (ver apps/payments/services.py::verify_mp_webhook_signature),
      # crea estos secrets en Secret Manager con el valor de "Firma secreta"
      # del panel de MP (Tus integraciones > Webhooks), y descomenta:
      #   gcloud secrets create MP_CL_WEBHOOK_SECRET --data-file=-
      #   gcloud secrets create MP_AR_WEBHOOK_SECRET --data-file=-
      # - --update-secrets=MP_CL_WEBHOOK_SECRET=MP_CL_WEBHOOK_SECRET:latest
      # - --update-secrets=MP_AR_WEBHOOK_SECRET=MP_AR_WEBHOOK_SECRET:latest
      # Sin esto configurado, el webhook sigue funcionando igual que antes
      # (solo loguea una advertencia), no se rompe nada mientras tanto.
      # Resend (emails). Remitente de marca con dominio verificado.
      - --set-env-vars=RESEND_FROM_EMAIL=LevelPro Audio <no-responder@levelproaudio.com>
      - --update-secrets=RESEND_API_KEY=RESEND_API_KEY:latest

  # ── 6. Deploy Frontend ───────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-frontend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_FRONTEND_SERVICE}"
      - --image=${_REPO}/frontend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --service-account=${_SA_EMAIL}

images:
  - "${_REPO}/backend:${_TAG}"
  - "${_REPO}/frontend:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY