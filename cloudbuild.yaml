# cloudbuild.yaml — raíz del repo

substitutions:
  _REGION:           "us-central1"
  _BACKEND_SERVICE:  "levelproaudio-backend"
  _FRONTEND_SERVICE: "levelproaudio-frontend"
  _SQL_INSTANCE:     "levelproaudio:us-central1:levelproaudio-db"
  # Cuenta de servicio de RUNTIME — permisos mínimos (cloudsql, secretos,
  # storage del bucket de medios). Separada de la cuenta que usa este
  # mismo build para construir/pushear/desplegar (esa la maneja Cloud
  # Build automáticamente con su propia cuenta de servicio del proyecto,
  # no necesita estar acá). Antes esta variable apuntaba a
  # levelproaudio-run, la misma cuenta amplia usada para todo — quedó
  # separada tras la auditoría de permisos.
  _SA_EMAIL:         "levelproaudio-app@levelproaudio.iam.gserviceaccount.com"
  _TAG:              "latest"
  _REPO:             "us-central1-docker.pkg.dev/levelproaudio/levelproaudio-docker"
  # Client ID de Google Sign-In — es público (va en el JS del frontend,
  # no es un secreto), por eso alcanza con una substitution simple en
  # vez de pasarlo por Secret Manager.
  _GOOGLE_CLIENT_ID: "147540000801-hpvtbt57k27bpa1un5brevnjipoqgita.apps.googleusercontent.com"
  # Branding del index.html (title, meta tags de redes sociales, GA) —
  # se inyecta en el build porque esas etiquetas las leen bots que no
  # ejecutan JS (WhatsApp, Facebook), así que no alcanza con el <Seo>
  # dinámico de React. Para un cliente nuevo, esto es lo que cambia al
  # "clonar y personalizar" antes del primer deploy.
  _SITE_NAME:        "LevelPro Audio"
  _SITE_TAGLINE:     "Equipamiento, Academia y Servicios de Audio"
  _SITE_DESCRIPTION: "LevelPro Audio: tienda de equipamiento profesional, academia con cursos y certificaciones, servicios y sorteos exclusivos. Envíos en Chile y Argentina."
  _SITE_URL:         "https://levelproaudio.com"
  _GA_ID:            "G-34L6J30WM5"

steps:

  # ── 0. Tests backend (bloquea el deploy si algo falla) ─────────
  # Corre el subset de tests que son unitarios reales de Django (DB en
  # memoria, sin dependencias externas). Los tests de integración HTTP
  # (test_loyalty.py, test_rewards.py, etc.) requieren un backend real
  # corriendo + datos sembrados, y quedan fuera de este paso rápido de CI;
  # se siguen corriendo manualmente contra staging/producción como hasta
  # ahora.
  - name: "python:3.12-slim"
    id: "backend-tests"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd backend
        pip install --quiet --no-cache-dir -r requirements/base.txt -r requirements/development.txt
        DJANGO_SECRET_KEY=ci-dummy-key DB_NAME=x DB_USER=x DB_PASSWORD=x \
          DJANGO_SETTINGS_MODULE=config.settings.test \
          python -m pytest tests/ apps/loyalty/ apps/billing/ apps/products/ apps/analytics/ apps/orders/ apps/services/ apps/academy/ apps/rewards/ apps/payments/ apps/users/ apps/seo/ apps/site_settings/ core/ -v
        # SQLite no implementa bloqueos de fila. La concurrencia se valida
        # con PostgreSQL efímero en este mismo paso, antes de ambos builds.
        apt-get update -qq
        apt-get install -y --no-install-recommends postgresql libpq-dev
        cd ..
        bash scripts/test-order-inventory-postgres.sh

  # ── 1. Build Backend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    waitFor: ["backend-tests"]
    args:
      - build
      - -t
      - "${_REPO}/backend:${_TAG}"
      - -f
      - backend/Dockerfile.prod
      - ./backend

  # ── 2. Build Frontend ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - build
      - -t
      - "${_REPO}/frontend:${_TAG}"
      - --build-arg
      - "VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}"
      - --build-arg
      - "VITE_SITE_NAME=${_SITE_NAME}"
      - --build-arg
      - "VITE_SITE_TAGLINE=${_SITE_TAGLINE}"
      - --build-arg
      - "VITE_SITE_DESCRIPTION=${_SITE_DESCRIPTION}"
      - --build-arg
      - "VITE_SITE_URL=${_SITE_URL}"
      - --build-arg
      - "VITE_GA_ID=${_GA_ID}"
      - -f
      - frontend/Dockerfile.prod
      - ./frontend

  # ── 3. Push Backend ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args: ["push", "${_REPO}/backend:${_TAG}"]

  # ── 4. Push Frontend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args: ["push", "${_REPO}/frontend:${_TAG}"]

  # ── 5. Deploy Backend ────────────────────────────────────────
  # Ambos deploys esperan las dos imágenes: si falla el build o push
  # del frontend, el backend tampoco empieza a desplegarse.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["push-backend", "push-frontend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_BACKEND_SERVICE}"
      - --image=${_REPO}/backend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=5
      - --service-account=${_SA_EMAIL}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=DJANGO_SETTINGS_MODULE=config.settings.production
      - --set-env-vars=CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}
      # ── Config de pagos (no secreta) ──
      - --set-env-vars=FRONTEND_URL=https://levelproaudio.com
      - --set-env-vars=SITE_URL=https://levelproaudio.com
      - --set-env-vars=BACKEND_URL=https://levelproaudio.com
      - --set-env-vars=PAYPAL_MODE=live
      - --set-env-vars=USD_CLP_RATE=950
      - --update-secrets=DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest
      - --update-secrets=SECRET_KEY=DJANGO_SECRET_KEY:latest
      - --update-secrets=DB_NAME=DB_NAME:latest
      - --update-secrets=DB_USER=DB_USER:latest
      - --update-secrets=DB_PASSWORD=DB_PASSWORD:latest
      - --update-secrets=GCS_BUCKET_NAME=levelproaudio-gcs-bucket:latest
      - --update-secrets=GCS_PROJECT_ID=levelproaudio-gcs-project:latest
      - --update-secrets=DJANGO_ALLOWED_HOSTS=DJANGO_ALLOWED_HOSTS:latest
      # ── Credenciales de pago (Secret Manager) ──
      - --update-secrets=MP_CL_ACCESS_TOKEN=MP_CL_ACCESS_TOKEN:latest
      - --update-secrets=MP_CL_PUBLIC_KEY=MP_CL_PUBLIC_KEY:latest
      # Crear y dar acceso ANTES del push: docs/patches/03-webhooks.md.
      - --update-secrets=MP_CL_WEBHOOK_SECRET=MP_CL_WEBHOOK_SECRET:latest
      - --update-secrets=PAYPAL_CLIENT_ID=PAYPAL_CLIENT_ID:latest
      - --update-secrets=PAYPAL_CLIENT_SECRET=PAYPAL_CLIENT_SECRET:latest
      # AR permanece deshabilitado sin su secreto. Si se habilita esa cuenta,
      # configurar también sus credenciales y descomentar esta referencia:
      # - --update-secrets=MP_AR_WEBHOOK_SECRET=MP_AR_WEBHOOK_SECRET:latest
      # Resend (emails). Remitente de marca con dominio verificado.
      - --set-env-vars=RESEND_FROM_EMAIL=LevelPro Audio <no-responder@levelproaudio.com>
      - --update-secrets=RESEND_API_KEY=RESEND_API_KEY:latest

  # ── 6. Deploy Frontend ───────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-backend", "push-frontend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_FRONTEND_SERVICE}"
      - --image=${_REPO}/frontend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --service-account=${_SA_EMAIL}

images:
  - "${_REPO}/backend:${_TAG}"
  - "${_REPO}/frontend:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
