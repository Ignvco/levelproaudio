# cloudbuild.yaml — raíz del repo

substitutions:
  _REGION:              "us-central1"
  _BACKEND_SERVICE:     "levelproaudio-backend"
  _FRONTEND_SERVICE:    "levelproaudio-frontend"
  _MIGRATOR_JOB:        "levelproaudio-migrator-job"
  _SQL_INSTANCE:        "levelproaudio:us-central1:levelproaudio-db"
  # Cuenta de servicio de RUNTIME — permisos mínimos (cloudsql, secretos,
  # storage del bucket de medios). Separada de la cuenta que usa este
  # mismo build para construir/pushear/desplegar (esa la maneja Cloud
  # Build automáticamente con su propia cuenta de servicio del proyecto,
  # no necesita estar acá). Antes esta variable apuntaba a
  # levelproaudio-run, la misma cuenta amplia usada para todo — quedó
  # separada tras la auditoría de permisos.
  _SA_EMAIL:                            "levelproaudio-app@levelproaudio.iam.gserviceaccount.com"
  _TAG:                                 "latest"
  _REPO:                                "us-central1-docker.pkg.dev/levelproaudio/levelproaudio-docker"
  _RELEASE_LOCK_BUCKET:                 "levelproaudio_cloudbuild"
  _RELEASE_LOCK_OBJECT:                 "locks/release_coordinator.lock"
  _RELEASE_LOCK_TTL_SECONDS:            "900"
  _RELEASE_LOCK_RENEW_INTERVAL_SECONDS: "60"
  _RELEASE_LOCK_WAIT_TIMEOUT_SECONDS:   "600"
  # Client ID de Google Sign-In — es público (va en el JS del frontend,
  # no es un secreto), por eso alcanza con una substitution simple en
  # vez de pasarlo por Secret Manager.
  _GOOGLE_CLIENT_ID:    "147540000801-hpvtbt57k27bpa1un5brevnjipoqgita.apps.googleusercontent.com"
  # Branding del index.html (title, meta tags de redes sociales, GA) —
  # se inyecta en el build porque esas etiquetas las leen bots que no
  # ejecutan JS (WhatsApp, Facebook), así que no alcanza con el <Seo>
  # dinámico de React. Para un cliente nuevo, esto es lo que cambia al
  # "clonar y personalizar" antes del primer deploy.
  _SITE_NAME:           "LevelPro Audio"
  _SITE_TAGLINE:        "Equipamiento, Academia y Servicios de Audio"
  _SITE_DESCRIPTION:    "LevelPro Audio: tienda de equipamiento profesional, academia con cursos y certificaciones, servicios y sorteos exclusivos. Envíos en Chile y Argentina."
  _SITE_URL:            "https://levelproaudio.com"
  _GA_ID:               "G-34L6J30WM5"

steps:

  # ── 0. Tests backend (bloquea el deploy si algo falla) ─────────
  # Corre el subset de tests que son unitarios reales de Django (DB en
  # memoria, sin dependencias externas). Los tests de integración HTTP
  # (test_loyalty.py, test_rewards.py, etc.) requieren un backend real
  # corriendo + datos sembrados, y quedan fuera de este paso rápido de CI;
  # se siguen corriendo manualmente contra staging/producción como hasta
  # ahora.
  - name: "python:3.12-slim"
    id: "backend-tests"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd backend
        pip install --quiet --no-cache-dir -r requirements/base.txt -r requirements/development.txt
        DJANGO_SECRET_KEY=ci-dummy-key DB_NAME=x DB_USER=x DB_PASSWORD=x \
          DJANGO_SETTINGS_MODULE=config.settings.test \
          python -m pytest tests/ apps/loyalty/ apps/billing/ apps/products/ apps/analytics/ apps/orders/ apps/services/ apps/academy/ apps/rewards/ apps/payments/ apps/users/ apps/seo/ apps/site_settings/ core/ -v
        # SQLite no implementa bloqueos de fila. La concurrencia se valida
        # con PostgreSQL efímero en este mismo paso, antes de ambos builds.
        apt-get update -qq
        apt-get install -y --no-install-recommends postgresql libpq-dev
        cd ..
        bash scripts/test-order-inventory-postgres.sh

  # ── 1. Build Backend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    waitFor: ["backend-tests"]
    args:
      - build
      - -t
      - "${_REPO}/backend:${_TAG}"
      - -t
      - "${_REPO}/backend:$COMMIT_SHA"
      - -f
      - backend/Dockerfile.prod
      - ./backend

  # ── 2. Build Frontend ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - build
      - -t
      - "${_REPO}/frontend:${_TAG}"
      - -t
      - "${_REPO}/frontend:$COMMIT_SHA"
      - --build-arg
      - "VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}"
      - --build-arg
      - "VITE_SITE_NAME=${_SITE_NAME}"
      - --build-arg
      - "VITE_SITE_TAGLINE=${_SITE_TAGLINE}"
      - --build-arg
      - "VITE_SITE_DESCRIPTION=${_SITE_DESCRIPTION}"
      - --build-arg
      - "VITE_SITE_URL=${_SITE_URL}"
      - --build-arg
      - "VITE_GA_ID=${_GA_ID}"
      - -f
      - frontend/Dockerfile.prod
      - ./frontend

  # ── 3. Push Backend ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[PUSH] Publicando imagen backend en Artifact Registry..."
        docker push "${_REPO}/backend:$COMMIT_SHA"
        docker push "${_REPO}/backend:${_TAG}"

        # Extraer digest inmutable estricto: formato imagen@sha256:<64 hex>
        # Se elimina todo fallback que sustituya silenciosamente un digest por un tag
        BACKEND_DIGEST=$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${_REPO}/backend:$COMMIT_SHA" 2>/dev/null | grep -E '^.+@sha256:[a-f0-9]{64}$$' | head -n 1 || true)
        if [ -z "$${BACKEND_DIGEST}" ]; then
          BACKEND_DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "${_REPO}/backend:$COMMIT_SHA" 2>/dev/null || true)
        fi

        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$${BACKEND_DIGEST}" ] || ! echo "$${BACKEND_DIGEST}" | grep -Eq "$${DIGEST_REGEX}"; then
          echo "[DIGEST_ERROR] ❌ No se pudo obtener un digest inmutable válido para backend."
          echo "[DIGEST_ERROR] Valor obtenido: '$${BACKEND_DIGEST}'"
          echo "[DIGEST_ERROR] Formato requerido: imagen@sha256:<64_hex_chars>"
          echo "[DIGEST_ERROR] Abortando pipeline: PROHIBIDO desplegar tags mutables en producción."
          exit 1
        fi

        echo "[DIGEST] ✓ Backend digest inmutable verificado: $${BACKEND_DIGEST}"
        echo "$${BACKEND_DIGEST}" > /workspace/backend_digest.txt

  # ── 4. Push Frontend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[PUSH] Publicando imagen frontend en Artifact Registry..."
        docker push "${_REPO}/frontend:$COMMIT_SHA"
        docker push "${_REPO}/frontend:${_TAG}"

        # Extraer digest inmutable estricto: formato imagen@sha256:<64 hex>
        # Se elimina todo fallback que sustituya silenciosamente un digest por un tag
        FRONTEND_DIGEST=$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${_REPO}/frontend:$COMMIT_SHA" 2>/dev/null | grep -E '^.+@sha256:[a-f0-9]{64}$$' | head -n 1 || true)
        if [ -z "$${FRONTEND_DIGEST}" ]; then
          FRONTEND_DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "${_REPO}/frontend:$COMMIT_SHA" 2>/dev/null || true)
        fi

        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$${FRONTEND_DIGEST}" ] || ! echo "$${FRONTEND_DIGEST}" | grep -Eq "$${DIGEST_REGEX}"; then
          echo "[DIGEST_ERROR] ❌ No se pudo obtener un digest inmutable válido para frontend."
          echo "[DIGEST_ERROR] Valor obtenido: '$${FRONTEND_DIGEST}'"
          echo "[DIGEST_ERROR] Formato requerido: imagen@sha256:<64_hex_chars>"
          echo "[DIGEST_ERROR] Abortando pipeline: PROHIBIDO desplegar tags mutables en producción."
          exit 1
        fi

        echo "[DIGEST] ✓ Frontend digest inmutable verificado: $${FRONTEND_DIGEST}"
        echo "$${FRONTEND_DIGEST}" > /workspace/frontend_digest.txt

  # ── 5. Coordinated Release (Lock Atómico + Migraciones + Deploy Backend & Frontend) ─
  # Ejecuta toda la sección crítica bajo un único orquestador Python (`scripts/release_coordinator.py`)
  # garantizando:
  # - Lock distribuido GCS condicionado por generación (`--if-generation-match`) vía `gcloud storage`.
  # - Renovación activa periódica (heartbeat) para builds > 15 minutos y recuperación atómica de huérfanos.
  # - Liberación garantizada verificada por propietario/generación en `finally` y ante señales SIGTERM/SIGINT.
  # - Validación fail-closed de historial Git (incluyendo unshallow automático), digests inmutables,
  #   migraciones desacopladas y despliegue secuencial backend -> frontend para el mismo COMMIT_SHA.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "coordinated-release"
    waitFor: ["push-backend", "push-frontend"]
    entrypoint: python3
    args:
      - "scripts/release_coordinator.py"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "COMMIT_SHA=$COMMIT_SHA"
      - "PROJECT_ID=$PROJECT_ID"
      - "REGION=${_REGION}"
      - "BACKEND_SERVICE=${_BACKEND_SERVICE}"
      - "FRONTEND_SERVICE=${_FRONTEND_SERVICE}"
      - "MIGRATOR_JOB=${_MIGRATOR_JOB}"
      - "SQL_INSTANCE=${_SQL_INSTANCE}"
      - "SA_EMAIL=${_SA_EMAIL}"
      - "RELEASE_LOCK_BUCKET=${_RELEASE_LOCK_BUCKET}"
      - "RELEASE_LOCK_OBJECT=${_RELEASE_LOCK_OBJECT}"
      - "RELEASE_LOCK_TTL_SECONDS=${_RELEASE_LOCK_TTL_SECONDS}"
      - "RELEASE_LOCK_RENEW_INTERVAL_SECONDS=${_RELEASE_LOCK_RENEW_INTERVAL_SECONDS}"
      - "RELEASE_LOCK_WAIT_TIMEOUT_SECONDS=${_RELEASE_LOCK_WAIT_TIMEOUT_SECONDS}"
      - "BACKEND_DIGEST_FILE=/workspace/backend_digest.txt"
      - "FRONTEND_DIGEST_FILE=/workspace/frontend_digest.txt"

images:
  - "${_REPO}/backend:${_TAG}"
  - "${_REPO}/backend:$COMMIT_SHA"
  - "${_REPO}/frontend:${_TAG}"
  - "${_REPO}/frontend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "2400s"
