# cloudbuild.yaml — raíz del repo

substitutions:
  _REGION:              "us-central1"
  _BACKEND_SERVICE:     "levelproaudio-backend"
  _FRONTEND_SERVICE:    "levelproaudio-frontend"
  _MIGRATOR_JOB:        "levelproaudio-migrator-job"
  _SQL_INSTANCE:        "levelproaudio:us-central1:levelproaudio-db"
  # Cuenta de servicio de RUNTIME — permisos mínimos (cloudsql, secretos,
  # storage del bucket de medios). Separada de la cuenta que usa este
  # mismo build para construir/pushear/desplegar (esa la maneja Cloud
  # Build automáticamente con su propia cuenta de servicio del proyecto,
  # no necesita estar acá). Antes esta variable apuntaba a
  # levelproaudio-run, la misma cuenta amplia usada para todo — quedó
  # separada tras la auditoría de permisos.
  _SA_EMAIL:            "levelproaudio-app@levelproaudio.iam.gserviceaccount.com"
  _TAG:                 "latest"
  _REPO:                "us-central1-docker.pkg.dev/levelproaudio/levelproaudio-docker"
  _RELEASE_LOCK_BUCKET: "levelproaudio-gcs-bucket"
  # Client ID de Google Sign-In — es público (va en el JS del frontend,
  # no es un secreto), por eso alcanza con una substitution simple en
  # vez de pasarlo por Secret Manager.
  _GOOGLE_CLIENT_ID:    "147540000801-hpvtbt57k27bpa1un5brevnjipoqgita.apps.googleusercontent.com"
  # Branding del index.html (title, meta tags de redes sociales, GA) —
  # se inyecta en el build porque esas etiquetas las leen bots que no
  # ejecutan JS (WhatsApp, Facebook), así que no alcanza con el <Seo>
  # dinámico de React. Para un cliente nuevo, esto es lo que cambia al
  # "clonar y personalizar" antes del primer deploy.
  _SITE_NAME:           "LevelPro Audio"
  _SITE_TAGLINE:        "Equipamiento, Academia y Servicios de Audio"
  _SITE_DESCRIPTION:    "LevelPro Audio: tienda de equipamiento profesional, academia con cursos y certificaciones, servicios y sorteos exclusivos. Envíos en Chile y Argentina."
  _SITE_URL:            "https://levelproaudio.com"
  _GA_ID:               "G-34L6J30WM5"

steps:

  # ── 0. Tests backend (bloquea el deploy si algo falla) ─────────
  # Corre el subset de tests que son unitarios reales de Django (DB en
  # memoria, sin dependencias externas). Los tests de integración HTTP
  # (test_loyalty.py, test_rewards.py, etc.) requieren un backend real
  # corriendo + datos sembrados, y quedan fuera de este paso rápido de CI;
  # se siguen corriendo manualmente contra staging/producción como hasta
  # ahora.
  - name: "python:3.12-slim"
    id: "backend-tests"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd backend
        pip install --quiet --no-cache-dir -r requirements/base.txt -r requirements/development.txt
        DJANGO_SECRET_KEY=ci-dummy-key DB_NAME=x DB_USER=x DB_PASSWORD=x \
          DJANGO_SETTINGS_MODULE=config.settings.test \
          python -m pytest tests/ apps/loyalty/ apps/billing/ apps/products/ apps/analytics/ apps/orders/ apps/services/ apps/academy/ apps/rewards/ apps/payments/ apps/users/ apps/seo/ apps/site_settings/ core/ -v
        # SQLite no implementa bloqueos de fila. La concurrencia se valida
        # con PostgreSQL efímero en este mismo paso, antes de ambos builds.
        apt-get update -qq
        apt-get install -y --no-install-recommends postgresql libpq-dev
        cd ..
        bash scripts/test-order-inventory-postgres.sh

  # ── 1. Build Backend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    waitFor: ["backend-tests"]
    args:
      - build
      - -t
      - "${_REPO}/backend:${_TAG}"
      - -t
      - "${_REPO}/backend:$COMMIT_SHA"
      - -f
      - backend/Dockerfile.prod
      - ./backend

  # ── 2. Build Frontend ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - build
      - -t
      - "${_REPO}/frontend:${_TAG}"
      - -t
      - "${_REPO}/frontend:$COMMIT_SHA"
      - --build-arg
      - "VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}"
      - --build-arg
      - "VITE_SITE_NAME=${_SITE_NAME}"
      - --build-arg
      - "VITE_SITE_TAGLINE=${_SITE_TAGLINE}"
      - --build-arg
      - "VITE_SITE_DESCRIPTION=${_SITE_DESCRIPTION}"
      - --build-arg
      - "VITE_SITE_URL=${_SITE_URL}"
      - --build-arg
      - "VITE_GA_ID=${_GA_ID}"
      - -f
      - frontend/Dockerfile.prod
      - ./frontend

  # ── 3. Push Backend ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[PUSH] Publicando imagen backend en Artifact Registry..."
        docker push "${_REPO}/backend:$COMMIT_SHA"
        docker push "${_REPO}/backend:${_TAG}"

        # Extraer digest inmutable estricto: formato imagen@sha256:<64 hex>
        # Se elimina todo fallback que sustituya silenciosamente un digest por un tag
        BACKEND_DIGEST=$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${_REPO}/backend:$COMMIT_SHA" 2>/dev/null | grep -E '^.+@sha256:[a-f0-9]{64}$$' | head -n 1 || true)
        if [ -z "$${BACKEND_DIGEST}" ]; then
          BACKEND_DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "${_REPO}/backend:$COMMIT_SHA" 2>/dev/null || true)
        fi

        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$${BACKEND_DIGEST}" ] || ! echo "$${BACKEND_DIGEST}" | grep -Eq "$${DIGEST_REGEX}"; then
          echo "[DIGEST_ERROR] ❌ No se pudo obtener un digest inmutable válido para backend."
          echo "[DIGEST_ERROR] Valor obtenido: '$${BACKEND_DIGEST}'"
          echo "[DIGEST_ERROR] Formato requerido: imagen@sha256:<64_hex_chars>"
          echo "[DIGEST_ERROR] Abortando pipeline: PROHIBIDO desplegar tags mutables en producción."
          exit 1
        fi

        echo "[DIGEST] ✓ Backend digest inmutable verificado: $${BACKEND_DIGEST}"
        echo "$${BACKEND_DIGEST}" > /workspace/backend_digest.txt

  # ── 4. Push Frontend ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[PUSH] Publicando imagen frontend en Artifact Registry..."
        docker push "${_REPO}/frontend:$COMMIT_SHA"
        docker push "${_REPO}/frontend:${_TAG}"

        # Extraer digest inmutable estricto: formato imagen@sha256:<64 hex>
        # Se elimina todo fallback que sustituya silenciosamente un digest por un tag
        FRONTEND_DIGEST=$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${_REPO}/frontend:$COMMIT_SHA" 2>/dev/null | grep -E '^.+@sha256:[a-f0-9]{64}$$' | head -n 1 || true)
        if [ -z "$${FRONTEND_DIGEST}" ]; then
          FRONTEND_DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "${_REPO}/frontend:$COMMIT_SHA" 2>/dev/null || true)
        fi

        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$${FRONTEND_DIGEST}" ] || ! echo "$${FRONTEND_DIGEST}" | grep -Eq "$${DIGEST_REGEX}"; then
          echo "[DIGEST_ERROR] ❌ No se pudo obtener un digest inmutable válido para frontend."
          echo "[DIGEST_ERROR] Valor obtenido: '$${FRONTEND_DIGEST}'"
          echo "[DIGEST_ERROR] Formato requerido: imagen@sha256:<64_hex_chars>"
          echo "[DIGEST_ERROR] Abortando pipeline: PROHIBIDO desplegar tags mutables en producción."
          exit 1
        fi

        echo "[DIGEST] ✓ Frontend digest inmutable verificado: $${FRONTEND_DIGEST}"
        echo "$${FRONTEND_DIGEST}" > /workspace/frontend_digest.txt

  # ── 4.3. Concurrency & Out-of-Order Release Check ───────────
  # Previene colisiones concurrentes en el migrador y despliegues fuera de orden.
  # Adquiere lock de coordinación y valida no regresión respecto a producción.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "verify-release-ordering"
    waitFor: ["push-backend", "push-frontend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CURRENT_BUILD_ID="${BUILD_ID:-local}"

        echo "[RELEASE_GUARD] 1. Verificando concurrencia de pipelines activos..."
        if [ "$$CURRENT_BUILD_ID" != "local" ]; then
          query_concurrent_builds() {
            local out exit_code
            set +e
            out=$$(gcloud builds list --filter="status=WORKING AND id!=$$CURRENT_BUILD_ID" --format="value(id,createTime)" 2>&1)
            exit_code=$$?
            set -e
            if [ $$exit_code -ne 0 ]; then
              echo "[RELEASE_GUARD] ❌ Error consultando Cloud Build API: $$out" >&2
              return 1
            fi
            echo "$$out"
          }

          CONCURRENT_BUILDS=""
          RETRIES=3
          for attempt in $$(seq 1 $$RETRIES); do
            if CONCURRENT_BUILDS=$$(query_concurrent_builds); then
              break
            fi
            echo "[RELEASE_GUARD] Reintentando consulta a Cloud Build API ($$attempt/$$RETRIES)..."
            sleep 3
            if [ "$$attempt" -eq "$$RETRIES" ]; then
              echo "[RELEASE_GUARD] ❌ ERROR CRÍTICO: Falló la consulta a Cloud Build API tras $$RETRIES intentos."
              echo "[RELEASE_GUARD] Fail-closed: No se interpreta un error de consulta a la API de GCP como ausencia de concurrencia."
              exit 1
            fi
          done

          if [ -n "$$CONCURRENT_BUILDS" ]; then
            echo "[RELEASE_GUARD] ⚠️ Se detectaron builds concurrentes en progreso:"
            echo "$$CONCURRENT_BUILDS"
            echo "[RELEASE_GUARD] Esperando liberación de builds concurrentes previos (máx 180s)..."
            MAX_WAIT=18
            for i in $$(seq 1 $$MAX_WAIT); do
              sleep 10
              if ! REMAINING=$$(query_concurrent_builds); then
                echo "[RELEASE_GUARD] ❌ Error consultando builds activos durante espera. Fail-closed."
                exit 1
              fi
              if [ -z "$$REMAINING" ]; then
                echo "[RELEASE_GUARD] ✓ Builds concurrentes finalizados. Continuando."
                break
              fi
              echo "[RELEASE_GUARD] Esperando liberación de build concurrente... ($$i/$$MAX_WAIT)"
              if [ "$$i" -eq "$$MAX_WAIT" ]; then
                echo "[RELEASE_GUARD] ❌ Timeout esperando liberación de builds concurrentes. Abortando para prevenir colisión."
                exit 1
              fi
            done
          fi

          # Adquisición de lock de coordinación distribuido con recuperación de stale locks
          if command -v gsutil >/dev/null 2>&1; then
            LOCK_URI="gs://${_RELEASE_LOCK_BUCKET}/locks/release_coordinator.lock"
            echo "[RELEASE_LOCK] Coordinando exclusión mutua de release en $$LOCK_URI..."
            LOCK_ACQUIRED=0
            MAX_LOCK_ATTEMPTS=12
            for attempt in $$(seq 1 $$MAX_LOCK_ATTEMPTS); do
              EXISTING_LOCK=""
              set +e
              EXISTING_LOCK=$$(gsutil cat "$$LOCK_URI" 2>/dev/null)
              STAT_EXIT=$$?
              set -e

              if [ $$STAT_EXIT -ne 0 ] || [ -z "$$EXISTING_LOCK" ]; then
                LOCK_PAYLOAD="build_id=$$CURRENT_BUILD_ID commit=$COMMIT_SHA timestamp=$$(date +%s)"
                if echo "$$LOCK_PAYLOAD" | gsutil -q -h "x-goog-if-generation-match:0" cp - "$$LOCK_URI" 2>/dev/null; then
                  echo "[RELEASE_LOCK] ✓ Lock de coordinación adquirido exitosamente."
                  LOCK_ACQUIRED=1
                  break
                fi
              else
                PREV_BUILD_ID=$$(echo "$$EXISTING_LOCK" | grep -o 'build_id=[^ ]*' | cut -d= -f2 || true)
                PREV_TIMESTAMP=$$(echo "$$EXISTING_LOCK" | grep -o 'timestamp=[^ ]*' | cut -d= -f2 || true)
                CURRENT_TS=$$(date +%s)
                LOCK_AGE=$$(( CURRENT_TS - PREV_TIMESTAMP ))

                IS_STALE=0
                if [ -n "$$PREV_BUILD_ID" ] && [ "$$PREV_BUILD_ID" != "$$CURRENT_BUILD_ID" ]; then
                  set +e
                  PREV_STATUS=$$(gcloud builds describe "$$PREV_BUILD_ID" --format="value(status)" 2>/dev/null)
                  set -e
                  if [ "$$PREV_STATUS" = "FAILURE" ] || [ "$$PREV_STATUS" = "CANCELLED" ] || [ "$$PREV_STATUS" = "TIMEOUT" ] || [ "$$PREV_STATUS" = "SUCCESS" ]; then
                    echo "[RELEASE_LOCK] ⚠️ Lock previo pertenecía a build '$$PREV_BUILD_ID' con estado '$$PREV_STATUS'."
                    IS_STALE=1
                  elif [ $$LOCK_AGE -gt 900 ]; then
                    echo "[RELEASE_LOCK] ⚠️ Lock previo superó TTL de 15m ($${LOCK_AGE}s)."
                    IS_STALE=1
                  fi
                elif [ $$LOCK_AGE -gt 900 ]; then
                  IS_STALE=1
                fi

                if [ $$IS_STALE -eq 1 ]; then
                  echo "[RELEASE_LOCK] ✓ Reclamando lock huérfano/stale de forma segura..."
                  gsutil rm -f "$$LOCK_URI" 2>/dev/null || true
                  LOCK_PAYLOAD="build_id=$$CURRENT_BUILD_ID commit=$COMMIT_SHA timestamp=$$(date +%s)"
                  if echo "$$LOCK_PAYLOAD" | gsutil -q cp - "$$LOCK_URI" 2>/dev/null; then
                    echo "[RELEASE_LOCK] ✓ Lock adquirido exitosamente tras recuperación de release previo."
                    LOCK_ACQUIRED=1
                    break
                  fi
                fi
              fi

              echo "[RELEASE_LOCK] Sección crítica ocupada ($$attempt/$$MAX_LOCK_ATTEMPTS). Esperando 10s..."
              sleep 10
            done

            if [ $$LOCK_ACQUIRED -ne 1 ]; then
              echo "[RELEASE_LOCK] ❌ No se pudo adquirir lock de coordinación. Abortando release para prevenir colisión."
              exit 1
            fi
          fi
        fi

        echo "[RELEASE_GUARD] 2. Verificando orden de despliegue y prevención de regresión..."
        ACTIVE_COMMIT=""
        set +e
        ACTIVE_COMMIT=$$(gcloud run services describe "${_BACKEND_SERVICE}" \
          --region="${_REGION}" \
          --format='value(metadata.labels["commit-sha"])' 2>&1)
        ACTIVE_EXIT=$$?
        set -e

        if [ $$ACTIVE_EXIT -ne 0 ]; then
          if echo "$$ACTIVE_COMMIT" | grep -qi "not found"; then
            echo "[RELEASE_GUARD] Servicio backend no existe aún. Primer despliegue permitido."
            ACTIVE_COMMIT=""
          else
            echo "[RELEASE_GUARD] ❌ Error consultando servicio ${_BACKEND_SERVICE}: $$ACTIVE_COMMIT"
            echo "[RELEASE_GUARD] Fail-closed: No se puede validar la versión activa en producción. Abortando."
            exit 1
          fi
        fi

        echo "$${ACTIVE_COMMIT}" > /workspace/base_commit.txt

        if [ -n "$$ACTIVE_COMMIT" ] && [ "$$ACTIVE_COMMIT" != "$COMMIT_SHA" ]; then
          echo "[RELEASE_GUARD] Commit en producción activa: $$ACTIVE_COMMIT"
          echo "[RELEASE_GUARD] Commit en este pipeline:     $COMMIT_SHA"
          if git merge-base --is-ancestor "$$ACTIVE_COMMIT" "$COMMIT_SHA" 2>/dev/null; then
            echo "[RELEASE_GUARD] ✓ Avance válido hacia adelante (Fast-forward/descendant)."
          else
            echo "[RELEASE_GUARD] ❌ ALERTA: Despliegue fuera de orden detectado. El commit activo en producción ($$ACTIVE_COMMIT) no es ancestro del commit a desplegar ($COMMIT_SHA)."
            echo "[RELEASE_GUARD] Abortando despliegue para prevenir regresión de código o migraciones."
            exit 1
          fi
        else
          echo "[RELEASE_GUARD] ✓ Servicio inicial o re-despliegue del mismo commit."
        fi

  # ── 4.5. Run Database Migrations (Decoupled Cloud Run Job) ───
  # LEVELPRO OS V4.0 — GATE 1.3: DECOUPLED MIGRATION RUNNER
  # 1. Configurar y actualizar la definición del Cloud Run Job con el digest inmutable
  #    correspondiente al release exacto que se desplegará antes de ejecutarlo.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "update-migrator-job"
    waitFor: ["verify-release-ordering"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMMUTABLE_DIGEST=$$(cat /workspace/backend_digest.txt)
        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$$IMMUTABLE_DIGEST" ] || ! echo "$$IMMUTABLE_DIGEST" | grep -Eq "$$DIGEST_REGEX"; then
          echo "[MIGRATOR_ERROR] ❌ Digest inmutable inválido para migrador: '$$IMMUTABLE_DIGEST'"
          exit 1
        fi
        echo "[MIGRATOR] Verificando e inyectando imagen inmutable de release en ${_MIGRATOR_JOB}..."
        echo "[MIGRATOR] Target immutable digest: $${IMMUTABLE_DIGEST}"
        gcloud run jobs update "${_MIGRATOR_JOB}" \
          --image="$${IMMUTABLE_DIGEST}" \
          --region="${_REGION}"

  # 2. Ejecutar el Job con la imagen verificada y esperar su terminación exitosa.
  #    Si la migración falla, el deploy del backend y frontend se detiene inmediatamente.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-migrations"
    waitFor: ["update-migrator-job"]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - "${_MIGRATOR_JOB}"
      - --region=${_REGION}
      - --wait

  # ── 5. Deploy Backend ────────────────────────────────────────
  # Despliega el backend web con la MISMA imagen inmutable verificada por el migrador.
  # Revalida la versión activa inmediatamente antes de publicar para detectar intervenciones concurrentes.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["run-migrations"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMMUTABLE_DIGEST=$$(cat /workspace/backend_digest.txt)
        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$$IMMUTABLE_DIGEST" ] || ! echo "$$IMMUTABLE_DIGEST" | grep -Eq "$$DIGEST_REGEX"; then
          echo "[DEPLOY_ERROR] ❌ Digest inmutable inválido para backend: '$$IMMUTABLE_DIGEST'"
          exit 1
        fi

        # Revalidar versión activa inmediatamente antes de publicar
        BASE_COMMIT=""
        if [ -f /workspace/base_commit.txt ]; then
          BASE_COMMIT=$$(cat /workspace/base_commit.txt)
        fi
        if [ -n "$$BASE_COMMIT" ]; then
          echo "[DEPLOY_GUARD] Revalidando versión activa en Cloud Run inmediatamente antes de publicar..."
          PRE_DEPLOY_COMMIT=$$(gcloud run services describe "${_BACKEND_SERVICE}" \
            --region="${_REGION}" \
            --format='value(metadata.labels["commit-sha"])' 2>/dev/null || true)
          if [ -n "$$PRE_DEPLOY_COMMIT" ] && [ "$$PRE_DEPLOY_COMMIT" != "$$BASE_COMMIT" ] && [ "$$PRE_DEPLOY_COMMIT" != "$COMMIT_SHA" ]; then
            echo "[DEPLOY_GUARD] ⚠️ DIVERGENCIA DETECTADA: La versión activa en Cloud Run cambió a '$$PRE_DEPLOY_COMMIT' durante migraciones."
            if ! git merge-base --is-ancestor "$$PRE_DEPLOY_COMMIT" "$COMMIT_SHA" 2>/dev/null; then
              echo "[DEPLOY_GUARD] ❌ ERROR: '$$PRE_DEPLOY_COMMIT' no es ancestro de $COMMIT_SHA. Abortando deploy para prevenir sobreescritura."
              exit 1
            fi
            echo "[DEPLOY_GUARD] ✓ Versión divergente '$$PRE_DEPLOY_COMMIT' es ancestro válido de $COMMIT_SHA."
          fi
        fi

        echo "[DEPLOY] Desplegando backend con digest inmutable verificado: $${IMMUTABLE_DIGEST}"
        gcloud run deploy "${_BACKEND_SERVICE}" \
          --image="$${IMMUTABLE_DIGEST}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --set-labels="commit-sha=$COMMIT_SHA" \
          --port=8080 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=5 \
          --service-account="${_SA_EMAIL}" \
          --set-cloudsql-instances="${_SQL_INSTANCE}" \
          --set-env-vars=DJANGO_SETTINGS_MODULE=config.settings.production \
          --set-env-vars=CLOUD_SQL_CONNECTION_NAME="${_SQL_INSTANCE}" \
          --set-env-vars=FRONTEND_URL=https://levelproaudio.com \
          --set-env-vars=SITE_URL=https://levelproaudio.com \
          --set-env-vars=BACKEND_URL=https://levelproaudio.com \
          --set-env-vars=PAYPAL_MODE=live \
          --set-env-vars=USD_CLP_RATE=950 \
          --update-secrets=DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest \
          --update-secrets=SECRET_KEY=DJANGO_SECRET_KEY:latest \
          --update-secrets=DB_NAME=DB_NAME:latest \
          --update-secrets=DB_USER=DB_USER:latest \
          --update-secrets=DB_PASSWORD=DB_PASSWORD:latest \
          --update-secrets=GCS_BUCKET_NAME=levelproaudio-gcs-bucket:latest \
          --update-secrets=GCS_PROJECT_ID=levelproaudio-gcs-project:latest \
          --update-secrets=DJANGO_ALLOWED_HOSTS=DJANGO_ALLOWED_HOSTS:latest \
          --update-secrets=MP_CL_ACCESS_TOKEN=MP_CL_ACCESS_TOKEN:latest \
          --update-secrets=MP_CL_PUBLIC_KEY=MP_CL_PUBLIC_KEY:latest \
          --update-secrets=MP_CL_WEBHOOK_SECRET=MP_CL_WEBHOOK_SECRET:latest \
          --update-secrets=PAYPAL_CLIENT_ID=PAYPAL_CLIENT_ID:latest \
          --update-secrets=PAYPAL_CLIENT_SECRET=PAYPAL_CLIENT_SECRET:latest \
          --update-secrets=UALA_USERNAME=UALA_USERNAME:latest \
          --update-secrets=UALA_CLIENT_ID=UALA_CLIENT_ID:latest \
          --update-secrets=UALA_CLIENT_SECRET=UALA_CLIENT_SECRET:latest \
          --set-env-vars="RESEND_FROM_EMAIL=LevelPro Audio <no-responder@levelproaudio.com>" \
          --update-secrets=RESEND_API_KEY=RESEND_API_KEY:latest

  # ── 6. Deploy Frontend ───────────────────────────────────────
  # Despliega el frontend web ÚNICAMENTE tras el éxito total de migraciones
  # y despliegue del backend (waitFor: deploy-backend).
  # Garantiza que el frontend utilice el digest inmutable verificado y que
  # el backend de producción ya esté corriendo activamente el mismo COMMIT_SHA.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["deploy-backend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # 1. Validar digest inmutable de frontend
        FRONTEND_DIGEST=$$(cat /workspace/frontend_digest.txt)
        DIGEST_REGEX='^[a-zA-Z0-9._/-]+@sha256:[a-f0-9]{64}$$'
        if [ -z "$$FRONTEND_DIGEST" ] || ! echo "$$FRONTEND_DIGEST" | grep -Eq "$$DIGEST_REGEX"; then
          echo "[DEPLOY_FRONTEND] ❌ Digest inmutable inválido o ausente para frontend: '$$FRONTEND_DIGEST'"
          echo "[DEPLOY_FRONTEND] Formato requerido: imagen@sha256:<64_hex_chars>. Abortando."
          exit 1
        fi

        # 2. Revalidar que el backend activo en producción corresponde exactamente a este release
        echo "[DEPLOY_FRONTEND] Verificando que backend activo corresponda al release $COMMIT_SHA..."
        BACKEND_ACTIVE_SHA=$$(gcloud run services describe "${_BACKEND_SERVICE}" \
          --region="${_REGION}" \
          --format='value(metadata.labels["commit-sha"])' 2>/dev/null || true)
        if [ "$$BACKEND_ACTIVE_SHA" != "$COMMIT_SHA" ]; then
          echo "[DEPLOY_FRONTEND] ❌ El backend activo en producción ($$BACKEND_ACTIVE_SHA) no coincide con el release actual ($COMMIT_SHA)."
          echo "[DEPLOY_FRONTEND] Abortando despliegue de frontend: backend y frontend deben ser del mismo release."
          exit 1
        fi
        echo "[DEPLOY_FRONTEND] ✓ Backend activo verificado en commit $COMMIT_SHA."

        # 3. Desplegar frontend con digest inmutable verificado
        echo "[DEPLOY_FRONTEND] Desplegando frontend con digest inmutable: $$FRONTEND_DIGEST"
        gcloud run deploy "${_FRONTEND_SERVICE}" \
          --image="$$FRONTEND_DIGEST" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --set-labels="commit-sha=$COMMIT_SHA" \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --service-account="${_SA_EMAIL}"

  # ── 7. Release Coordination Lock ─────────────────────────────
  # Libera de forma segura el lock de coordinación al finalizar exitosamente ambos despliegues.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "release-coordination-lock"
    waitFor: ["deploy-frontend"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[RELEASE_LOCK] Despliegues de backend y frontend finalizados con éxito."
        echo "[RELEASE_LOCK] Liberando lock de coordinación de release..."
        if [ "${BUILD_ID:-local}" != "local" ] && command -v gsutil >/dev/null 2>&1; then
          gsutil rm -f "gs://${_RELEASE_LOCK_BUCKET}/locks/release_coordinator.lock" 2>/dev/null || true
        fi
        echo "[RELEASE_LOCK] ✓ Lock de coordinación liberado exitosamente."

images:
  - "${_REPO}/backend:${_TAG}"
  - "${_REPO}/backend:$COMMIT_SHA"
  - "${_REPO}/frontend:${_TAG}"
  - "${_REPO}/frontend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
