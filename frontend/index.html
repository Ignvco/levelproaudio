<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) — cada instalación/cliente debería tener su
         propia cuenta de Analytics, no compartir la de LevelPro -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_ID%');
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- nginx replaces this block with metadata from the requested public page.
         Vite dev/preview uses the fallback; production includes the fragment. -->
    <!--# block name="seo_fallback" -->
    <title data-initial-seo>LevelPro Audio</title>
    <meta data-initial-seo name="description" content="Equipamiento, academia y servicios de audio profesional." />
    <meta data-initial-seo name="robots" content="noindex, nofollow" />
    <meta data-initial-seo property="og:title" content="LevelPro Audio" />
    <meta data-initial-seo property="og:description" content="Equipamiento, academia y servicios de audio profesional." />
    <meta data-initial-seo property="og:type" content="website" />
    <meta data-initial-seo property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta data-initial-seo name="twitter:card" content="summary_large_image" />
    <!--# endblock -->
    <!--# include virtual="/_seo/head" stub="seo_fallback" -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
